name: Web K userscript

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    paths:
      - .npmrc
      - package.json
      - package-lock.json
      - tampermonkey/**
      - .github/workflows/tampermonkey-web-k-userscript.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 连续构建两次并比较输出
        shell: bash
        run: |
          set -euo pipefail
          run_command() {
            set +e
            "$@"
            code=$?
            set -e
            echo "exit_code=${code} command=$*"
            return "${code}"
          }

          run_command npm run build:tampermonkey:web-k
          sha256sum tampermonkey/telegram-media-continuity-web-k.user.js | tee /tmp/web-k-first.sha256
          run_command npm run build:tampermonkey:web-k
          sha256sum tampermonkey/telegram-media-continuity-web-k.user.js | tee /tmp/web-k-second.sha256
          run_command diff -u /tmp/web-k-first.sha256 /tmp/web-k-second.sha256

      - name: 执行生成文件一致性检查
        shell: bash
        run: |
          set +e
          npm run check:tampermonkey:web-k
          code=$?
          set -e
          echo "exit_code=${code} command=npm run check:tampermonkey:web-k"
          exit "${code}"

      - name: 确认 M3 模块结构
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tampermonkey/src/web-k/legacy-main.js
          test -f tampermonkey/src/web-k/app.js
          test -d tampermonkey/src/web-k/features/continuous-browsing
          test -d tampermonkey/src/web-k/features/close-position
          test -d tampermonkey/src/web-k/features/control-panel
          test -d tampermonkey/src/web-k/features/debug
          echo "exit_code=0 command=verify M3 module structure"

      - name: 执行生成脚本语法检查
        shell: bash
        run: |
          set +e
          node --check tampermonkey/telegram-media-continuity-web-k.user.js
          code=$?
          set -e
          echo "exit_code=${code} command=node --check tampermonkey/telegram-media-continuity-web-k.user.js"
          exit "${code}"

      - name: 执行 Git 差异检查
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_command() {
            set +e
            "$@"
            code=$?
            set -e
            echo "exit_code=${code} command=$*"
            return "${code}"
          }

          run_command git diff --check "${BASE_SHA}...HEAD"
          run_command git diff --name-status "${BASE_SHA}...HEAD"
          run_command git status --short
          run_command git rev-parse HEAD

      - name: 上传生成 userscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-media-continuity-web-k-userscript-linux
          path: tampermonkey/telegram-media-continuity-web-k.user.js
          if-no-files-found: error

      - name: 确认生成文件已提交
        shell: bash
        run: |
          set +e
          git diff --exit-code -- tampermonkey/telegram-media-continuity-web-k.user.js
          code=$?
          set -e
          echo "exit_code=${code} command=git diff --exit-code -- tampermonkey/telegram-media-continuity-web-k.user.js"
          exit "${code}"

  verify-windows:
    runs-on: windows-latest
    env:
      NODE_ENV: production
      NPM_CONFIG_OMIT: optional
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: 检查 npm 项目配置
        shell: pwsh
        run: |
          npm config get include
          npm config get omit
          npm config get bin-links

      - name: 安装依赖
        shell: pwsh
        run: npm ci

      - name: 验证 Vite 与 Rolldown 安装
        shell: pwsh
        run: |
          npm exec --no -- vite --version
          node -e "console.log(require.resolve('rolldown/package.json'))"
          node -e "console.log(require.resolve('@rolldown/binding-win32-x64-msvc/package.json'))"

      - name: 连续构建两次并比较输出
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build:tampermonkey:web-k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstHash = (Get-FileHash 'tampermonkey/telegram-media-continuity-web-k.user.js' -Algorithm SHA256).Hash.ToLower()
          Write-Host "first_sha256=$firstHash"

          npm run build:tampermonkey:web-k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secondHash = (Get-FileHash 'tampermonkey/telegram-media-continuity-web-k.user.js' -Algorithm SHA256).Hash.ToLower()
          Write-Host "second_sha256=$secondHash"

          if ($firstHash -ne $secondHash) {
            throw "连续构建输出不一致：$firstHash != $secondHash"
          }

      - name: 确认 M3 模块结构
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'tampermonkey/src/web-k/legacy-main.js') { throw 'legacy-main.js 仍然存在' }
          foreach ($path in @(
            'tampermonkey/src/web-k/app.js',
            'tampermonkey/src/web-k/features/continuous-browsing',
            'tampermonkey/src/web-k/features/close-position',
            'tampermonkey/src/web-k/features/control-panel',
            'tampermonkey/src/web-k/features/debug'
          )) {
            if (-not (Test-Path $path)) { throw "M3 必需路径缺失：$path" }
          }

      - name: 执行 Windows 静态检查
        shell: pwsh
        run: |
          npm run check:tampermonkey:web-k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tampermonkey/telegram-media-continuity-web-k.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- tampermonkey/telegram-media-continuity-web-k.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 Windows 生成 userscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-media-continuity-web-k-userscript-windows
          path: tampermonkey/telegram-media-continuity-web-k.user.js
          if-no-files-found: error
