name: Web K userscript one-time generation

on:
  pull_request:
    types:
      - synchronize
    branches:
      - codex/tampermonkey-media-continuity
  push:
    branches:
      - refactor/tampermonkey-web-k-feature-modules

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/tampermonkey-web-k-feature-modules

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: 安装依赖并生成 userscript
        run: |
          set -euo pipefail
          npm ci
          npm run build:tampermonkey:web-k
          npm run check:tampermonkey:web-k
          node --check tampermonkey/telegram-media-continuity-web-k.user.js

      - name: 提交生成文件
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tampermonkey/telegram-media-continuity-web-k.user.js
          if git diff --cached --quiet; then
            echo "生成文件已是最新状态"
            exit 0
          fi
          git commit -m "build: 更新 Web K userscript 生成产物"
          git push origin HEAD:refactor/tampermonkey-web-k-feature-modules
